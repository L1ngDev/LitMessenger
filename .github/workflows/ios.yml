name: iOS Build (IPA for Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios/

      - name: Build unsigned app (device)
        run: |
          xcodebuild -project ios/LitMessenger.xcodeproj \
            -scheme LitMessenger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r LitMessenger.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LitMessenger.ipa
          path: LitMessenger.ipa
