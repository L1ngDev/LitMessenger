name: iOS Build (IPA for Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $xc"
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios/

      - name: Build unsigned app (device)
        run: |
          set -o pipefail
          xcodebuild -project ios/LitMessenger.xcodeproj \
            -scheme LitMessenger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r LitMessenger.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LitMessenger.ipa
          path: LitMessenger.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
