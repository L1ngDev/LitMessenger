name: iOS Build (IPA for Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios/

      - name: Build unsigned app (device)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          xcodebuild -project ios/LitMessenger.xcodeproj \
            -scheme LitMessenger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            tail -n 120 build.log > err.txt
            echo "TOKEN_LEN=${#GITHUB_TOKEN}"
            gh api -H "Authorization: Bearer $GITHUB_TOKEN" -X POST "repos/L1ngDev/LitMessenger/commits/$GITHUB_SHA/comments" -f body=@err.txt || echo "post-failed"
          fi
          exit $rc

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r LitMessenger.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LitMessenger.ipa
          path: LitMessenger.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
